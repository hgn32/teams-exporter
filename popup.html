<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <title>Teams メッセージ抽出</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, "Segoe UI", sans-serif;
      padding: 12px;
      font-size: 13px;
      color: #222;
    }

    h1 {
      font-size: 14px;
      margin: 0 0 8px;
    }

    button {
      width: 100%;
      padding: 8px;
      margin: 4px 0;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f5f5f5;
    }

    button:hover {
      background: #ebebeb;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 8px;
      white-space: pre-wrap;
      font-size: 12px;
      color: #444;
      max-height: 140px;
      overflow-y: auto;
      border-top: 1px solid #eee;
      padding-top: 6px;
    }

    .row {
      display: flex;
      gap: 6px;
    }

    .row button {
      flex: 1;
    }

    .format-row {
      display: flex;
      gap: 14px;
      align-items: center;
      margin: 2px 0 6px;
      font-size: 12px;
      color: #444;
    }

    .format-row label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

  </style>
</head>

<body>
  <h1>Teams メッセージ抽出</h1>

  <div class="format-row" id="formatRow">
    <span>出力形式:</span>
    <label><input type="radio" name="format" value="docx" checked> Word (.docx)</label>
    <label><input type="radio" name="format" value="html"> HTML</label>
  </div>

  <button id="actionBtn">自動スクロール抽出を開始</button>
  <button id="openTeamsBtn" style="display: none;">Teams Web版を開く</button>

  <div id="status">待機中...</div>

  <script src="popup.js"></script>
</body>

</html>
